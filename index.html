<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			Restore the path encoded by 404.html (GitHub Pages SPA redirect).
			Must run before the app so react-router sees the real URL.
		-->
		<script type="text/javascript">
			(function (l) {
				if (l.search[1] === "/") {
					var decoded = l.search
						.slice(1)
						.split("&")
						.map(function (s) {
							return s.replace(/~and~/g, "&");
						})
						.join("?");
					window.history.replaceState(
						null,
						null,
						l.pathname.slice(0, -1) + decoded + l.hash
					);
				}
			})(window.location);
		</script>
		<link rel="icon" href="/favicon.ico" />
